        // Admin Dashboard Modal with Supabase Auth & DB Persistence
        function AdminModal({ data, setData, onClose, showToast }) {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [activeSubTab, setActiveSubTab] = useState('biodata');
            const [formData, setFormData] = useState(data);
            const [enquiries, setEnquiries] = useState([]);
            const [isLoadingEnquiries, setIsLoadingEnquiries] = useState(false);
            const [isUploadingPhoto, setIsUploadingPhoto] = useState(false);

            // Check if already logged in via Supabase Auth on open
            useEffect(() => {
                async function checkSession() {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        // Verify admin role
                        const { data: roleData, error } = await supabase.from('administrator_roles').select('*').eq('user_id', session.user.id).single();
                        if (roleData) {
                            setIsAuthenticated(true);
                            fetchEnquiries();
                        }
                    }
                }
                checkSession();
            }, []);

            const fetchEnquiries = async () => {
                setIsLoadingEnquiries(true);
                try {
                    const { data: enqData, error } = await supabase.from('family_enquiries').select('*').order('created_at', { ascending: false });
                    if (error) throw error;
                    setEnquiries(enqData || []);
                } catch (err) {
                    console.error("Error fetching enquiries:", err.message);
                } finally {
                    setIsLoadingEnquiries(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsAuthenticating(true);
                try {
                    const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                        email: authEmail,
                        password: authPassword
                    });

                    if (authError) throw authError;

                    // Verify user has admin role in administrator_roles table
                    const { data: roleData, error: roleError } = await supabase
                        .from('administrator_roles')
                        .select('*')
                        .eq('user_id', authData.user.id)
                        .single();

                    if (roleError || !roleData) {
                        await supabase.auth.signOut();
                        throw new Error("Access denied. This account is not authorized as an administrator.");
                    }

                    setIsAuthenticated(true);
                    showToast("Admin access granted successfully!");
                    fetchEnquiries();
                } catch (err) {
                    showToast(err.message || "Authentication failed.");
                } finally {
                    setIsAuthenticating(false);
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setIsAuthenticated(false);
                showToast("Logged out from admin session.");
            };

            const handleSave = async () => {
                try {
                    // Update biodata profile in Supabase
                    const { error: bioError } = await supabase.from('biodata_profiles').upsert({
                        full_name: formData.personal.fullName,
                        dob: formData.personal.dob,
                        time_of_birth: formData.personal.timeOfBirth,
                        place_of_birth: formData.personal.placeOfBirth,
                        height: formData.personal.height,
                        blood_group: formData.personal.bloodGroup,
                        languages: formData.personal.languages,
                        religion: formData.religious.religion,
                        caste: formData.religious.caste,
                        gothra: formData.religious.gothra,
                        rashi: formData.religious.rashi,
                        degree: formData.education.degree,
                        college: formData.education.college,
                        designation: formData.education.designation,
                        organization: formData.education.organization,
                        location: formData.education.location,
                        father_name: formData.family.fatherName,
                        father_prof: formData.family.fatherProf,
                        mother_name: formData.family.motherName,
                        mother_prof: formData.family.motherProf,
                        sibling: formData.family.sibling,
                        native: formData.family.native,
                        phone: formData.contact.phone,
                        email: formData.contact.email,
                        show_phone: formData.contact.showPhone,
                        show_address: formData.contact.showAddress,
                        updated_at: new Date()
                    });

                    if (bioError) throw bioError;

                    setData(formData);
                    showToast("All changes saved and published to Supabase!");
                    onClose();
                } catch (err) {
                    showToast("Error saving changes: " + err.message);
                }
            };

            const handleAddPhoto = async (e) => {
                e.preventDefault();
                const fileInput = e.target.photoFile.files[0];
                const caption = e.target.photoCaption.value;
                const category = e.target.photoCategory.value;

                if (!fileInput) {
                    showToast("Please select an image file to upload.");
                    return;
                }

                setIsUploadingPhoto(true);
                try {
                    const fileExt = fileInput.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 7))}.${fileExt}`;
                    const filePath = `${fileName}`;

                    // Upload file to Supabase Storage Bucket 'biodata-media'
                    const { error: uploadError } = await supabase.storage
                        .from('biodata-media')
                        .upload(filePath, fileInput);

                    if (uploadError) throw uploadError;

                    // Get Public URL
                    const { data: pubUrlData } = supabase.storage
                        .from('biodata-media')
                        .getPublicUrl(filePath);

                    const publicUrl = pubUrlData.publicUrl;

                    // Insert photo record into gallery_photos table
                    const { data: insertedPhoto, error: dbError } = await supabase
                        .from('gallery_photos')
                        .insert([{
                            url: publicUrl,
                            caption: caption || 'New Photograph',
                            category: category || 'Portrait',
                            photo_date: new Date().toISOString().split('T')[0],
                            is_profile: false,
                            is_published: true
                        }])
                        .select()
                        .single();

                    if (dbError) throw dbError;

                    const newPhotoObj = {
                        id: insertedPhoto.id,
                        url: insertedPhoto.url,
                        caption: insertedPhoto.caption,
                        category: insertedPhoto.category,
                        date: insertedPhoto.photo_date,
                        isProfile: insertedPhoto.is_profile,
                        isPublished: insertedPhoto.is_published
                    };

                    setFormData({
                        ...formData,
                        photos: [newPhotoObj, ...formData.photos]
                    });
                    e.target.reset();
                    showToast("New photo uploaded and published successfully!");
                } catch (err) {
                    showToast("Photo upload failed: " + err.message);
                } finally {
                    setIsUploadingPhoto(false);
                }
            };

            const handleDeletePhoto = async (id) => {
                try {
                    const { error } = await supabase.from('gallery_photos').delete().eq('id', id);
                    if (error) throw error;

                    setFormData({
                        ...formData,
                        photos: formData.photos.filter(p => p.id !== id)
                    });
                    showToast("Photo removed.");
                } catch (err) {
                    showToast("Error deleting photo: " + err.message);
                }
            };

            const handleSetProfilePhoto = async (id) => {
                try {
                    // Reset all to is_profile = false
                    await supabase.from('gallery_photos').update({ is_profile: false }).neq('id', '00000000-0000-0000-0000-000000000000');
                    // Set selected to is_profile = true
                    await supabase.from('gallery_photos').update({ is_profile: true }).eq('id', id);

                    setFormData({
                        ...formData,
                        photos: formData.photos.map(p => ({
                            ...p,
                            isProfile: p.id === id
                        }))
                    });
                    showToast("Main profile photo updated!");
                } catch (err) {
                    showToast("Error updating profile photo: " + err.message);
                }
            };

            const handleTogglePublish = async (id, currentStatus) => {
                try {
                    const newStatus = !currentStatus;
                    await supabase.from('gallery_photos').update({ is_published: newStatus }).eq('id', id);
                    setFormData({
                        ...formData,
                        photos: formData.photos.map(p => p.id === id ? { ...p, isPublished: newStatus } : p)
                    });
                    showToast(newStatus ? "Photo published." : "Photo unpublished.");
                } catch (err) {
                    showToast("Error updating publish status: " + err.message);
                }
            };

            const handleDeleteEnquiry = async (id) => {
                try {
                    const { error } = await supabase.from('family_enquiries').delete().eq('id', id);
                    if (error) throw error;
                    setEnquiries(enquiries.filter(e => e.id !== id));
                    showToast("Enquiry deleted.");
                } catch (err) {
                    showToast("Error deleting enquiry: " + err.message);
                }
            };

            const handleToggleReadEnquiry = async (id, currentStatus) => {
                const nextStatus = currentStatus === 'read' ? 'unread' : 'read';
                try {
                    await supabase.from('family_enquiries').update({ status: nextStatus }).eq('id', id);
                    setEnquiries(enquiries.map(e => e.id === id ? { ...e, status: nextStatus } : e));
                } catch (err) {
                    showToast("Error updating enquiry status.");
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-ivory rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gold relative space-y-6">
                            <button onClick={onClose} className="absolute top-4 right-4 text-warmgray hover:text-forest">
                                <Icon name="close" className="w-5 h-5" />
                            </button>
                            <div className="text-center space-y-2">
                                <div className="w-14 h-14 bg-forest text-gold rounded-full flex items-center justify-center mx-auto shadow-inner">
                                    <Icon name="lock" className="w-6 h-6" />
                                </div>
                                <h3 className="font-serif text-2xl font-bold text-forest">Admin Dashboard Login</h3>
                                <p className="text-xs text-warmgray">Sign in securely with Supabase administrator credentials.</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold uppercase tracking-wider text-warmgray mb-1">Admin Email</label>
                                    <input 
                                        type="email" 
                                        required
                                        value={authEmail}
                                        onChange={e => setAuthEmail(e.target.value)}
                                        placeholder="admin@satyamrout.com"
                                        className="w-full px-4 py-3 rounded-xl border border-gold/30 bg-white focus:outline-none focus:ring-2 focus:ring-gold text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold uppercase tracking-wider text-warmgray mb-1">Admin Password</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={authPassword}
                                        onChange={e => setAuthPassword(e.target.value)}
                                        placeholder="Enter password"
                                        className="w-full px-4 py-3 rounded-xl border border-gold/30 bg-white focus:outline-none focus:ring-2 focus:ring-gold text-sm"
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    disabled={isAuthenticating}
                                    className="w-full bg-forest hover:bg-forest-dark text-white py-3 rounded-xl font-medium transition shadow border border-gold/30 disabled:opacity-50"
                                >
                                    {isAuthenticating ? 'Authenticating...' : 'Authenticate'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-ivory rounded-3xl max-w-5xl w-full max-h-[95vh] overflow-y-auto shadow-2xl border-2 border-gold relative my-8 flex flex-col">
                        {/* Admin Header */}
                        <div className="sticky top-0 bg-forest text-white p-4 px-8 flex items-center justify-between z-10 border-b border-gold/30">
                            <div className="flex items-center space-x-3">
                                <Icon name="settings" className="w-6 h-6 text-gold" />
                                <h3 className="font-serif text-xl font-bold">Admin Management Dashboard</h3>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button onClick={handleSave} className="bg-gold hover:bg-gold-dark text-forest font-semibold px-5 py-2 rounded-xl text-sm flex items-center space-x-2 transition shadow">
                                    <Icon name="check" className="w-4 h-4" />
                                    <span>Save & Publish</span>
                                </button>
                                <button onClick={handleLogout} className="bg-red-800 hover:bg-red-900 text-white font-medium px-4 py-2 rounded-xl text-sm transition">
                                    Logout
                                </button>
                                <button onClick={onClose} className="p-2 bg-white/10 hover:bg-white/25 rounded-full transition">
                                    <Icon name="close" className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        {/* Admin Subtabs */}
                        <div className="bg-cream border-b border-gold/20 px-8 py-3 flex space-x-4">
                            <button 
                                onClick={() => setActiveSubTab('biodata')}
                                className={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeSubTab === 'biodata' ? 'bg-forest text-white shadow' : 'text-forest hover:bg-gold/10'}`}
                            >
                                Edit Biodata Details
                            </button>
                            <button 
                                onClick={() => setActiveSubTab('photos')}
                                className={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeSubTab === 'photos' ? 'bg-forest text-white shadow' : 'text-forest hover:bg-gold/10'}`}
                            >
                                Manage Photo Gallery
                            </button>
                            <button 
                                onClick={() => { setActiveSubTab('enquiries'); fetchEnquiries(); }}
                                className={`px-4 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 ${activeSubTab === 'enquiries' ? 'bg-forest text-white shadow' : 'text-forest hover:bg-gold/10'}`}
                            >
                                <span>Family Enquiries Inbox</span>
                                {enquiries.filter(e => e.status === 'unread').length > 0 && (
                                    <span className="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">
                                        {enquiries.filter(e => e.status === 'unread').length}
                                    </span>
                                )}
                            </button>
                            <button 
                                onClick={() => setActiveSubTab('privacy')}
                                className={`px-4 py-2 rounded-xl text-sm font-medium transition ${activeSubTab === 'privacy' ? 'bg-forest text-white shadow' : 'text-forest hover:bg-gold/10'}`}
                            >
                                Privacy & Contact Settings
                            </button>
                        </div>

                        {/* Admin Content Area */}
                        <div className="p-8 space-y-8 flex-1">
                            {activeSubTab === 'biodata' && (
                                <div className="space-y-8">
                                    {/* Personal Details */}
                                    <div className="bg-white p-6 rounded-2xl border border-gold/20 shadow-sm space-y-4">

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

                                                <label className="block text-xs font-semibold text-warmgray mb-1">Full Name</label>

                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Time of Birth</label>
                                                <input type="text" value={formData.personal.timeOfBirth} onChange={e => setFormData({...formData, personal: {...formData.personal, timeOfBirth: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Place of Birth</label>
                                                <input type="text" value={formData.personal.placeOfBirth} onChange={e => setFormData({...formData, personal: {...formData.personal, placeOfBirth: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Height</label>
                                                <input type="text" value={formData.personal.height} onChange={e => setFormData({...formData, personal: {...formData.personal, height: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Blood Group</label>
                                                <input type="text" value={formData.personal.bloodGroup} onChange={e => setFormData({...formData, personal: {...formData.personal, bloodGroup: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Education & Career */}
                                    <div className="bg-white p-6 rounded-2xl border border-gold/20 shadow-sm space-y-4">
                                        <h4 className="font-serif text-xl font-bold text-forest">Education & Professional Details</h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Degree</label>
                                                <input type="text" value={formData.education.degree} onChange={e => setFormData({...formData, education: {...formData.education, degree: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">College / University</label>
                                                <input type="text" value={formData.education.college} onChange={e => setFormData({...formData, education: {...formData.education, college: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Current Designation</label>
                                                <input type="text" value={formData.education.designation} onChange={e => setFormData({...formData, education: {...formData.education, designation: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Organization</label>
                                                <input type="text" value={formData.education.organization} onChange={e => setFormData({...formData, education: {...formData.education, organization: e.target.value}})} className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeSubTab === 'photos' && (
                                <div className="space-y-8">
                                    {/* Add Photo Form with Supabase Storage upload */}
                                    <form onSubmit={handleAddPhoto} className="bg-white p-6 rounded-2xl border border-gold/20 shadow-sm space-y-4">
                                        <h4 className="font-serif text-xl font-bold text-forest">Upload New Photograph to Supabase Storage</h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Select Image File</label>
                                                <input type="file" name="photoFile" accept="image/*" required className="w-full text-xs text-warmgray file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-forest file:text-white hover:file:bg-forest-dark" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Caption</label>
                                                <input type="text" name="photoCaption" placeholder="Photo caption" className="w-full px-3 py-2 border rounded-lg text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-warmgray mb-1">Category</label>
                                                <select name="photoCategory" className="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                                                    <option value="Portrait">Portrait</option>
                                                    <option value="Traditional">Traditional</option>
                                                    <option value="Travel">Travel</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button 
                                            type="submit" 
                                            disabled={isUploadingPhoto}
                                            className="bg-forest hover:bg-forest-dark text-white px-6 py-2.5 rounded-xl text-sm font-medium transition disabled:opacity-50"
                                        >
                                            {isUploadingPhoto ? 'Uploading to Supabase...' : 'Upload & Publish Photo'}
                                        </button>
                                    </form>

                                    {/* Photo List */}
                                    <div className="bg-white p-6 rounded-2xl border border-gold/20 shadow-sm space-y-4">
                                        <h4 className="font-serif text-xl font-bold text-forest">Manage Existing Photos</h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {formData.photos.map(photo => (
                                                <div key={photo.id} className="border rounded-xl p-3 flex flex-col space-y-3 bg-cream/40">
                                                    <div className="h-40 rounded-lg overflow-hidden bg-white relative">
                                                        <img src={photo.url} alt={photo.caption} className="w-full h-full object-cover" onError={(e)=>{e.target.src="https://placehold.co/300x300/1E3A2F/D4AF37?text=Image"}} />
                                                        <span className={`absolute top-2 right-2 text-[10px] px-2 py-0.5 rounded font-semibold ${photo.isPublished !== false ? 'bg-green-600 text-white' : 'bg-gray-500 text-white'}`}>
                                                            {photo.isPublished !== false ? 'Published' : 'Hidden'}
                                                        </span>
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-sm truncate">{photo.caption}</p>
                                                        <p className="text-xs text-warmgray">{photo.category} {photo.isProfile && <span className="text-gold font-bold">• Main Profile</span>}</p>
                                                    </div>
                                                    <div className="flex items-center justify-between pt-2 border-t border-gold/20 text-xs">
                                                        {!photo.isProfile && (
                                                            <button onClick={() => handleSetProfilePhoto(photo.id)} className="text-forest font-semibold hover:underline">
                                                                Set Profile
                                                            </button>
                                                        )}
                                                        <button onClick={() => handleTogglePublish(photo.id, photo.isPublished !== false)} className="text-warmgray hover:text-forest font-semibold">
                                                            {photo.isPublished !== false ? 'Unpublish' : 'Publish'}
                                                        </button>
                                                        <button onClick={() => handleDeletePhoto(photo.id)} className="text-red-600 font-semibold flex items-center space-x-1">
                                                            <Icon name="trash" className="w-3.5 h-3.5" />
                                                            <span>Delete</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeSubTab === 'enquiries' && (
                                <div className="space-y-6 bg-white p-6 rounded-2xl border border-gold/20 shadow-sm">
                                    <div className="flex items-center justify-between">
                                        <h4 className="font-serif text-xl font-bold text-forest">Family Enquiries Inbox</h4>
                                        <button onClick={fetchEnquiries} className="flex items-center space-x-1 text-xs text-forest bg-gold/20 hover:bg-gold/30 px-3 py-1.5 rounded-lg transition font-medium">
                                            <Icon name="refresh" className="w-3.5 h-3.5" />
                                            <span>Refresh</span>
                                        </button>
                                    </div>

                                    {isLoadingEnquiries ? (
                                        <p className="text-sm text-warmgray text-center py-8">Loading enquiries...</p>
                                    ) : enquiries.length === 0 ? (
                                        <p className="text-sm text-warmgray text-center py-8">No family inquiries received yet.</p>
                                    ) : (
                                        <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                                            {enquiries.map(enq => (
                                                <div key={enq.id} className={`p-4 rounded-xl border transition space-y-2 ${enq.status === 'unread' ? 'bg-gold/10 border-gold/40' : 'bg-cream/40 border-gold/20'}`}>
                                                    <div className="flex items-center justify-between">
                                                        <div>
                                                            <span className="font-serif font-bold text-forest text-lg">{enq.sender_name}</span>
                                                            <span className="ml-3 text-xs bg-forest text-gold px-2 py-0.5 rounded-md font-medium">{enq.contact_info}</span>
                                                        </div>
                                                        <span className="text-xs text-warmgray">{new Date(enq.created_at).toLocaleString()}</span>
                                                    </div>
                                                    <p className="text-sm text-forest/90 bg-white p-3 rounded-lg border border-gold/10">{enq.message}</p>
                                                    <div className="flex items-center justify-end space-x-4 pt-1 text-xs font-semibold">
                                                        <button 
                                                            onClick={() => handleToggleReadEnquiry(enq.id, enq.status)}
                                                            className="text-forest hover:underline"
                                                        >
                                                            Mark as {enq.status === 'read' ? 'Unread' : 'Read'}
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDeleteEnquiry(enq.id)}
                                                            className="text-red-600 hover:underline flex items-center space-x-1"
                                                        >
                                                            <Icon name="trash" className="w-3.5 h-3.5" />
                                                            <span>Delete</span>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeSubTab === 'privacy' && (
                                <div className="space-y-6 bg-white p-6 rounded-2xl border border-gold/20 shadow-sm">
                                    <h4 className="font-serif text-xl font-bold text-forest">Contact Visibility & Privacy</h4>
                                    <div className="space-y-4">
                                        <label className="flex items-center space-x-3 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={formData.contact.showPhone}
                                                onChange={e => setFormData({...formData, contact: {...formData.contact, showPhone: e.target.checked}})}
                                                className="w-5 h-5 text-forest rounded border-gold focus:ring-gold"
                                            />
                                            <span className="text-sm font-medium text-forest">Display phone number publicly on website</span>
                                        </label>

                                        <label className="flex items-center space-x-3 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={formData.contact.showAddress}
                                                onChange={e => setFormData({...formData, contact: {...formData.contact, showAddress: e.target.checked}})}
                                                className="w-5 h-5 text-forest rounded border-gold focus:ring-gold"
                                            />
                                            <span className="text-sm font-medium text-forest">Display exact residential address publicly</span>
                                        </label>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
